name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for the test run only. Real secrets never live in the repo.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnop
      DJANGO_DEBUG: "1"
      # Deliberately not UTC, to prove the tests do not depend on the server time zone.
      DJANGO_TIME_ZONE: America/Los_Angeles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run -v 3
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test

  # The live demo runs on PostgreSQL, so prove the migrations and tests pass there too.
  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bookmymeal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnop
      DJANGO_DEBUG: "1"
      DJANGO_TIME_ZONE: America/Los_Angeles
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/bookmymeal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test
      # The same steps the host runs with debug off: collect the admin's files and seed.
      - name: Production build steps
        env:
          DJANGO_DEBUG: "0"
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput
          python manage.py seed_demo

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci installs exactly what the lockfile pins, so builds are repeatable.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # Type-checks with TypeScript, then makes the production build.
      - name: Type-check and build
        run: npm run build
