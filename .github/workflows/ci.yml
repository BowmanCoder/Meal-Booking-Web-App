name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for the test run only. Real secrets never live in the repo.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnop
      DJANGO_DEBUG: "1"
      # Deliberately not UTC, to prove the tests do not depend on the server time zone.
      DJANGO_TIME_ZONE: America/Los_Angeles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run -v 3
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # TEMPORARY: `npm install` until the lockfile includes the test tools.
      # Switch back to `npm ci` once the updated package-lock.json is pushed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      # Type-checks with TypeScript, then makes the production build.
      - name: Type-check and build
        run: npm run build
