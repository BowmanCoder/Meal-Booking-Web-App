name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for the test run only. Real secrets never live in the repo.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnop
      DJANGO_DEBUG: "1"
      # Deliberately not UTC, to prove the tests do not depend on the server time zone.
      DJANGO_TIME_ZONE: America/Los_Angeles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run -v 3
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: react-popup only supports React 17. Removed in the frontend stage.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # CI=false: the legacy code has lint warnings that would otherwise fail the build.
      # Tightened once the dead code is removed in the frontend stage.
      - name: Build
        run: npm run build
        env:
          CI: "false"
