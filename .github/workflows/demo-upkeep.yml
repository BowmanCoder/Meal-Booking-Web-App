name: Demo upkeep

# The free web host has no scheduler, so GitHub runs the daily jobs instead:
# top up the demo data and send tomorrow's booking reminders.
# Off until the repository variable DEMO_UPKEEP is set to "on"
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    # 01:15 UTC = early evening on the US west coast, where the demo canteen "is".
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    name: Seed and remind
    if: ${{ vars.DEMO_UPKEEP == 'on' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      DJANGO_TIME_ZONE: ${{ vars.DJANGO_TIME_ZONE || 'America/Los_Angeles' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Top up demo data
        run: python manage.py seed_demo
      - name: Send tomorrow's reminders
        run: python manage.py send_reminders
