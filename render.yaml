# Render "Blueprint": describes both halves of the live demo so they can be
# created in one go (Render dashboard -> New -> Blueprint -> pick this repo).
# Values marked "sync: false" are secrets or addresses typed into the Render
# dashboard. They are never stored in this file. See docs/DEPLOYMENT.md.
services:
  # The Django API.
  - type: web
    name: bookmymeal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TIME_ZONE
        value: America/Los_Angeles
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # The React app, built once and served as plain files.
  - type: web
    name: bookmymeal
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      # Let React Router handle addresses such as /bookings on a page refresh.
      - type: rewrite
        source: /*
        destination: /index.html
